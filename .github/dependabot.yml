version: 2
updates:
  # Gradle/Kotlin/Compose/AndroidX dependencies (reads gradle/libs.versions.toml).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Only minor/patch bumps are grouped — a major version bump always gets its own PR, never
      # silently bundled with something unrelated.
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"
        update-types:
          - "minor"
          - "patch"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
        update-types:
          - "minor"
          - "patch"

  # Actions referenced in .github/workflows/*.yml (all currently pinned to a commit SHA with a
  # version comment — see docs/ci.md for the full pinning policy — Dependabot updates both the SHA
  # and the version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
