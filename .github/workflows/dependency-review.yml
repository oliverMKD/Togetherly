name: Dependency Review

# Compares the dependency graph before/after a PR and flags new vulnerable/disallowed
# dependencies. Requires the repository's dependency graph, already enabled for this public repo.
on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy (documented in docs/ci.md): fail the PR on a new high-or-critical severity
      # vulnerability; a moderate/low one is still visible in this job's summary for manual review,
      # but never blocks the build on its own.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
